syntax = "proto3";

import "google/protobuf/wrappers.proto"; // 이 패키지를 사용해 StringValue와 같은 잘 알려진 타입을 활용

package ecommerce;

option go_package = "productinfo/service/ordermgt";

service OrderManagement {
    rpc getOrder(google.protobuf.StringValue) returns (Order); // 주문을 조회하기 위한 원격 메서드
    rpc searchOrders(google.protobuf.StringValue) return (stream Order);
}

message Order { // Order 타입을 정의함
    string id = 1;
    repeated string items = 2; // repeated는 메시지에서 0을 포함해 한 번 이상 반복하는 필드를 나타내는 데 사용함, 여기서 하나의 주문 메시지에는 여러 아이템이 있을 수 있음
    string description = 3;
    float price = 4;
    string destination = 5;
}

